name: Test bridge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:pi
      - run: python3 tools/check_manifest_catalog.py vehicle_data
      - run: python3 tests/test-someip-manifest.py
      - run: node tests/motorscope-import.mjs
